description: Game Theory is a Bengaluru-based recreational sports and fitness membership
  platform operating 25+ centers across the city. Its consumer mobile app offers unlimited
  multi-sport coaching for kids and All Access adult memberships spanning 8+ sports
  — swimming, badminton, basketball, football, pickleball, squash, and table tennis
  — alongside pay-per-use slot booking, live game feeds, and corporate wellness programs.
  A Techstars-backed company, Game Theory publishes no public developer API, SDK, or
  documentation surface; this profile is maintained in the API Evangelist network as
  a company record awaiting any future developer platform.
